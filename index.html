<html lang="ja">

<style>
/* =========================================================
   ✅ EDIT HERE（ここだけ触ればOK）
   ========================================================= */
:root{
  /* ===== 全体フェード ===== */
  --screen-fade-ms: 3000ms;   /* 画面切替 */
  --text-fade-ms:   3500ms;   /* 文字フェード */

  /* ===== 共通色 ===== */
  --c-bg: #fff; --c-text:#111; --accent:#2563eb;

  /* ===== 画面2（歌詞）フォント ===== */
  --font-lyrics: 11px;

  /* ===== 画面3（タイトル/情報）フォント ===== */
  --font-title: 40px;
  --font-info:  16px;

  /* ===== 画面2（歌詞）配置 ===== */
  --lyrics-h: center; --lyrics-v: center;
  --lyrics-x: 0px; --lyrics-y: 0px;

  /* ===== 画面3（タイトル）位置 ===== */
  --title-left: 16px;
  --title-top:  50px;

  /* =======================================================
     画面1（スタート画面）
     ======================================================= */

  /* 背景画像（JSで確率切替するけど、初期表示は youg.png にしておく） */
  --start-bg: url("Images/youg.png");

  /* ✅ 背景をピッタリにする設定（ここが本体） */
  --start-bg-size: cover;     /* cover = 画面いっぱい（必要ならトリミング） */
  --start-bg-pos:  center;    /* どこを中心に見せるか */
  --start-bg-color:#fff;      /* 画像が読み込めない時の地色 */

  /* 黒フィルター（0.0〜1.0） */
  --start-filter: rgba(0,0,0,.0);

  /* 上の文字ブロック全体の「上からの位置」 */
  --start-top-pad: 10vh;

  /* ▼ 1行目：YourSong（サイズ & 左右ずらし） */
  --start-heading-size: clamp(34px, 10vw, 50px);
  --start-heading-x: -40px;

  /* ▼ 2行目：が届きました（サイズ & 左右ずらし） */
  --start-sub-size: clamp(18px, 6.5vw, 30px);
  --start-sub-x: 60px;

  /* 行間（1行目と2行目の距離） */
  --start-gap: 20px;

  /* 中央ボタン（透明・丸）のサイズ */
  --start-btn-size: clamp(140px, 34vw, 150px);

  /* ボタン位置（%で調整） */
  --start-btn-left: 49.2%;
  --start-btn-top:  49.5%;

  /* ボタンの透明度（0.0〜1.0） */
  --start-btn-opacity: 0.0;

  /* ボタン枠（透明にしたいなら rgba(...,0)） */
  --start-btn-border: rgba(0,0,0,.0);

  /* ✅ 画面1のフォント（ゴシック） */
  --start-font:
    system-ui,
    -apple-system,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    "YuGothic",
    "Meiryo",
    "Noto Sans JP",
    sans-serif;

  /* =======================================================
     画面3（情報ブロック）位置・間隔
     ======================================================= */
  --info-left: 50%;
  --info-top: 47%;
  --info-translate-x: -50%;
  --info-translate-y: -50%;

  --info-gap: 10px;
  --info-align: center; /* left / center / right */
  --info-image-max: 420px;

  /* 画面3：間隔（ここを増やすと広がる） */
  --gap-image-release: 28px; /* 画像 → release */
  --gap-album-live:   20px;  /* アルバム情報 → 演奏されたライブ */
  --gap-live-other:   20px;  /* 演奏されたライブ → その他リンク */
}

/* =========================================================
   Base
   ========================================================= */
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  display:grid;
  place-items:center;
  background:#0a0a0a;
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    "MS Mincho",
    "Noto Serif JP",
    serif;
}

.stage{
  position:relative;
  aspect-ratio: 9 / 16;
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  overflow:hidden;
  border-radius: 12px;
  background:#070707;
  -webkit-tap-highlight-color: transparent;
}

.screen{
  position:absolute;
  inset:0;
  display:grid;
  justify-items:stretch;
  align-items:stretch;
  opacity:0;
  pointer-events:none;
  transition: opacity var(--screen-fade-ms) ease;
}
.screen.active{ opacity:1; pointer-events:auto; }

/* =========================================================
   Screen 1（Start）
   ========================================================= */
#screen1{
  background-color: var(--start-bg-color);
  background-image: var(--start-bg);
  background-size: var(--start-bg-size);
  background-position: var(--start-bg-pos);
  background-repeat: no-repeat;
  color:#7b4400;
  text-align:center;
}
#screen1::before{
  content:"";
  position:absolute; inset:0;
  background: var(--start-filter);
  pointer-events:none;
}
#screen1 > *{ position:relative; z-index:1; }

/* 上部文字（2行） */
.startOverlay{
  position:absolute; inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top: var(--start-top-pad);
  gap: var(--start-gap);
  pointer-events:none;
}
.startHeading{
  font-family: var(--start-font);
  font-size: var(--start-heading-size);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.05;
  text-shadow: 0 2px 18px rgba(255, 255, 255, 0.15);
  transform: translateX(var(--start-heading-x));
}
.startSub{
  font-family: var(--start-font);
  font-size: var(--start-sub-size);
  font-weight: 800;
  line-height: 1.1;
  text-shadow: 0 2px 18px rgba(0,0,0,.15);
  transform: translateX(var(--start-sub-x));
}

/* 中央の透明丸ボタン */
.tapBtn{
  position:absolute;
  left: var(--start-btn-left);
  top:  var(--start-btn-top);
  transform: translate(-50%, -50%);
  width:  var(--start-btn-size);
  height: var(--start-btn-size);
  border-radius: 999px;

  background: rgba(255,255,255,var(--start-btn-opacity));
  border: 2px solid var(--start-btn-border);

  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);

  cursor:pointer;
  pointer-events:auto;
}
.tapBtn:focus{
  outline: 3px solid rgba(37, 99, 235, .45);
  outline-offset: 4px;
}

/* =========================================================
   Screen 2（Lyrics）
   ========================================================= */
#screen2{ background: var(--c-bg); color: var(--c-text); }

.lyricsWrap{
  justify-self: var(--lyrics-h);
  align-self: var(--lyrics-v);
  transform: translate(var(--lyrics-x), var(--lyrics-y));
  width: 92%;
  max-width: 560px;
  padding: 4vh 2vw;
  text-align: center;
}
.lyrics{
  white-space: pre-wrap;
  line-height: 1.9;
  font-size: var(--font-lyrics);
}
.lyrics .line{
  opacity:0; transform: translateY(10px);
  transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
}
.lyrics .line.show{ opacity:1; transform:none; }
.lyrics .seg{
  display:inline-block;
  opacity:0; transform: translateY(10px);
  transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
}
.lyrics .seg.show{ opacity:1; transform:none; }

/* =========================================================
   Screen 3（Info）
   ========================================================= */
#screen3{ background: var(--c-bg); color: var(--c-text); }
#screen3{
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
#screen3::before{
  content:"";
  position:absolute; inset:0;
  background: rgba(0,0,0,.75);
  pointer-events:none;
}
#screen3 > *{ position:relative; z-index:1; }
#screen3{ color:#f3f4f6; }
#screen3 .infoBlock{ color:#f3f4f6; }
#screen3 .linkList a{ color:#93c5fd; }

.titleFixed{
  position:absolute;
  left: var(--title-left);
  right: var(--title-left);
  top: var(--title-top);
  margin:0;
  font-size: var(--font-title);
  font-weight: 400;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
  opacity:0; transform: translateY(-6px);
  transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
}
.titleFixed.show{ opacity:1; transform:none; }

.infoBlock{
  position:absolute;
  left: var(--info-left);
  top:  var(--info-top);
  transform: translate(var(--info-translate-x), var(--info-translate-y));
  width: min(82%, 560px);
  display:flex;
  flex-direction: column;
  gap: var(--info-gap);
  align-items: var(--info-align);
  text-align: var(--info-align);
  opacity:0;
  transition: opacity var(--text-fade-ms) ease;
}
.infoBlock.show{ opacity:1; }

.infoStep{
  opacity:0;
  transform: translateY(8px);
  transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
}
.infoStep.show{ opacity:1; transform:none; }

.infoImage{
  width: min(92%, var(--info-image-max));
  height:auto;
  object-fit:contain;
  display:none;
  border-radius: 6px;
}

.infoText{ font-size: var(--font-info); margin:0; }

/* ✅「収録」だけは分割しない（収/録が別行にならない） */
.noSplit{
  display:inline-block;
  white-space: nowrap;
}

#infoRelease{ margin-top: var(--gap-image-release); }
#liveWrap{   margin-top: var(--gap-album-live); }
#otherWrap{  margin-top: var(--gap-live-other); }

.linkList{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.linkList a{ text-decoration: underline; }

@media (max-width: 420px) {
  :root{
    --title-left: 12px;
    --title-top:  12px;
  }
}
@media (max-aspect-ratio: 9/16) {
  .stage{ width: 100vw; height: calc(100vw * 16 / 9); }
}
</style>
</head>

let songs = [], current = null, timers = [];

function buildUrl(base, filename){
  if (!filename) return '';
  if (/^https?:\/\//i.test(filename)) return filename;
  const joined = base.replace(/\/?$/, '/') + filename;
  return encodeURI(joined);
}

/* ✅ ランダム用 */
function pickRandom(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ✅ 画面1の背景を確率で決めて、同時に抽選モードも決める */

  const hasOthers = Array.isArray(START_BG_RULE.OTHER_BG_CANDIDATES) && START_BG_RULE.OTHER_BG_CANDIDATES.length > 0;

  const useOther = hasOthers && (Math.random() < START_BG_RULE.OTHER_PROB);

  if (useOther){
    const bgFile = pickRandom(START_BG_RULE.OTHER_BG_CANDIDATES);
    startMode = 'single'; // songid >= 22
    document.documentElement.style.setProperty('--start-bg', `url("${buildUrl(CONFIG.IMAGE_BASE, bgFile)}")`);
  } else {
    startMode = 'album';  // songid < 22
    document.documentElement.style.setProperty('--start-bg', `url("${buildUrl(CONFIG.IMAGE_BASE, START_BG_RULE.MAIN_BG)}")`);
  }
}

/* ✅ startMode に応じて曲を抽選（album: <22 / single: >=22） */
function pickSongByStartMode(list){
  if (!Array.isArray(list) || !list.length) return null;

  const thr = Number(START_BG_RULE.THRESHOLD_SONGID ?? 22);

  const candidates = list.filter(s=>{
    const id = Number(s?.songid ?? s?.id ?? 0);
    return (startMode === 'single') ? (id >= thr) : (id < thr);
  });

  if (!candidates.length){
    // フォールバック（万一 JSON が偏ってた時）
    return list[Math.floor(Math.random() * list.length)];
  }
  return candidates[Math.floor(Math.random() * candidates.length)];
}

async function loadSongs(){
  try{
    const url = new URL(CONFIG.DATA_FILE, location.href).toString();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} (${res.statusText})`);
    const text = await res.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data) || !data.length) throw new Error('JSON is empty or not an array');
    songs = data.map(normalizeSong);
  }catch(e){
    console.error('[loadSongs] failed:', e);
    alert(`${CONFIG.DATA_FILE} が読み込めませんでした\n→ ${e.message}`);
    songs = [];
  }
}

/* ✅ songid >= 22 → singleid で singleInfo参照 */
function normalizeSong(raw){
  const links=[]; const L=raw.link;
  if(L){
    if(typeof L==='string') links.push({label:'Link',url:L});
    else if(Array.isArray(L)) L.forEach(x=> typeof x==='string'
      ? links.push({label:'Link',url:x})
      : (x?.url && links.push({label:x.label||'Link',url:x.url})));
    else if(L?.url) links.push({label:L.label||'Link',url:L.url});
  }

  const songidNum = Number(raw.songid ?? raw.id ?? 0);

  const albumid  = (raw.albumid  ?? raw.albumId  ?? raw.albumID  ?? raw.AlbumID  ?? raw.AlbumId);
  const singleid = (raw.singleid ?? raw.singleId ?? raw.singleID ?? raw.SingleID ?? raw.SingleId);

  const useSingle = songidNum >= 22;

  const metaAlbum  = albumInfo[String(albumid)] || {};
  const metaSingle = singleInfo[String(singleid)] || {};

  return {
    id: raw.songid ?? raw.id ?? null,
    songid: raw.songid ?? raw.id ?? null,

    kind: useSingle ? 'single' : 'album',
    albumid: useSingle ? null : (albumid ?? null),
    singleid: useSingle ? (singleid ?? null) : null,

    title: raw.Title || raw.title || '',

    // ✅ 画面3が読むキーをここで揃える
    album: useSingle
      ? (metaSingle.single || raw.single || raw.album || '')
      : (metaAlbum.album || raw.album || ''),

    albumdetail: useSingle
      ? (metaSingle.singledetail || raw.singledetail || raw.albumdetail || '')
      : (metaAlbum.albumdetail || raw.albumdetail || ''),

    release: useSingle
      ? (metaSingle.release ?? raw.release ?? '')
      : (metaAlbum.release ?? raw.release ?? ''),

    image: useSingle
      ? (metaSingle.image || raw.image || '')
      : (metaAlbum.image || raw.image || ''),

    lyrics: Array.isArray(raw.Lyrics) ? raw.Lyrics.join('\n') : String(raw.Lyrics || ''),
    links
  };
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
const later = (ms, fn) => { const t=setTimeout(fn, ms); timers.push(t); };

function fitTitleOneLine(el, { minPx = 14 } = {}){
  el.style.fontSize = '';
  requestAnimationFrame(() => {
    const cs = getComputedStyle(el);
    let size = parseFloat(cs.fontSize);
    const min = minPx;
    if (!el.clientWidth) return;

    let guard = 0;
    while (el.scrollWidth > el.clientWidth && size > min && guard < 200){
      size -= 1;
      el.style.fontSize = `${size}px`;
      guard++;
    }
  });
}

function buildLineWithInlineDelay(lineText){
  const lineEl = document.createElement('div');
  lineEl.className = 'line';

  const parts = String(lineText ?? '').split('|');
  const safeParts = parts.length ? parts : [''];

  safeParts.forEach((p)=>{
    const seg = document.createElement('span');
    seg.className = 'seg';
    seg.textContent = p.length ? p : (safeParts.length === 1 ? ' ' : '');
    lineEl.appendChild(seg);
  });

  return lineEl;
}

function setLyricLines(container, text){
  container.innerHTML = '';

  const normalized = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const hasCaretSep = /\n\^\s*/.test(normalized);

  const allLineEls = [];
  const allSegEls = [];

  if (hasCaretSep){
    const blocks = normalized.split(/\n\^\s*/);

    blocks.forEach((blockText, blockIndex)=>{
      const lines = String(blockText || '').split('\n');

      lines.forEach((lineText)=>{
        const lineEl = buildLineWithInlineDelay(lineText);
        container.appendChild(lineEl);
        allLineEls.push(lineEl);

        const segs = Array.from(lineEl.querySelectorAll('.seg'));
        segs.forEach((segEl, segIndex)=>{
          const showAt =
            CONFIG.LYRICS_DELAY_MS
            + blockIndex * CONFIG.STAGGER_BLOCK_MS
            + segIndex * CONFIG.STAGGER_INLINE_MS;

          allSegEls.push({ el: segEl, showAtMs: showAt });
        });

        later(CONFIG.LYRICS_DELAY_MS + blockIndex * CONFIG.STAGGER_BLOCK_MS, ()=>{
          lineEl.classList.add('show');
        });
      });
    });

    allSegEls.forEach(({el, showAtMs})=>{
      later(showAtMs, ()=> el.classList.add('show'));
    });

    const lastShow = allSegEls.length
      ? Math.max(...allSegEls.map(x => x.showAtMs))
      : CONFIG.LYRICS_DELAY_MS;

    const fadeOutStartAt = lastShow + CONFIG.HOLD_AFTER_LAST_WITH_CARET_MS;

    later(fadeOutStartAt, ()=>{
      allSegEls.forEach(x => x.el.classList.remove('show'));
      allLineEls.forEach(x => x.classList.remove('show'));
    });

    return fadeOutStartAt + CONFIG.TEXT_FADE_MS;

  } else {
    const lines = normalized.split('\n');

    lines.forEach((lineText)=>{
      const lineEl = buildLineWithInlineDelay(lineText);
      container.appendChild(lineEl);
      allLineEls.push(lineEl);

      const segs = Array.from(lineEl.querySelectorAll('.seg'));
      segs.forEach((segEl, segIndex)=>{
        const showAt =
          CONFIG.LYRICS_DELAY_MS
          + segIndex * CONFIG.STAGGER_INLINE_MS;

        allSegEls.push({ el: segEl, showAtMs: showAt });
      });
    });

    later(CONFIG.LYRICS_DELAY_MS, ()=>{
      allLineEls.forEach(el => el.classList.add('show'));
    });

    allSegEls.forEach(({el, showAtMs})=>{
      later(showAtMs, ()=> el.classList.add('show'));
    });

    const lastShow = allSegEls.length
      ? Math.max(...allSegEls.map(x => x.showAtMs))
      : CONFIG.LYRICS_DELAY_MS;

    const fadeOutStartAt = lastShow + CONFIG.HOLD_AFTER_LAST_NO_CARET_MS;

    later(fadeOutStartAt, ()=>{
      allSegEls.forEach(x => x.el.classList.remove('show'));
      allLineEls.forEach(x => x.classList.remove('show'));
    });

    return fadeOutStartAt + CONFIG.TEXT_FADE_MS;
  }
}

function resetUI(){
  document.getElementById('lyrics').innerHTML = '';
  document.getElementById('songTitleFixed').textContent = '';
  document.getElementById('songTitleFixed').classList.remove('show');
  document.getElementById('songTitleFixed').style.fontSize = '';
  document.getElementById('screen3').style.backgroundImage = '';
  document.getElementById('infoBlock').classList.remove('show');
  document.querySelectorAll('.infoStep').forEach(el => el.classList.remove('show'));
}

function isLiveLink(label){
  const s = String(label || '');
  return /(披露|演奏).*(ライブ)/.test(s) || (/(ライブ)/.test(s) && /(披露|演奏)/.test(s));
}
function makeLinksHTML(items){
  return items.map(l=>{
    if (typeof l === 'string') return `<a href="${l}" target="_blank" rel="noopener">Link</a>`;
    if (l?.url) return `<a href="${l.url}" target="_blank" rel="noopener">${l.label||'Link'}</a>`;
    return '';
  }).filter(Boolean).join('');
}

function renderAll(song){
  const fadeoutDoneAt = setLyricLines(document.getElementById('lyrics'), (song.lyrics||'').trim());

  const titleEl = document.getElementById('songTitleFixed');
  titleEl.textContent = song.title || '—';
  fitTitleOneLine(titleEl, { minPx: 14 });

  const s3 = document.getElementById('screen3');
  if (song.image) s3.style.backgroundImage = `url("${buildUrl(CONFIG.IMAGE_BASE, song.image)}")`;
  else s3.style.backgroundImage = '';

  const img = document.getElementById('infoImage');
  if (song.image){
    img.src = buildUrl(CONFIG.IMAGE_BASE, song.image);
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }

  const rel = String(song.release || '').trim();
  document.getElementById('infoRelease').textContent = rel ? `Release：${rel}` : '';

  /* ✅ ここから：収録だけ分割禁止（収/録が別行にならない） */
  const detail = String(song.albumdetail || '').trim();
  const alb    = String(song.album || '').trim();

  const infoAlbEl = document.getElementById('infoAlbumInfo');
  infoAlbEl.textContent = '';

  let prefix = '';
  let needShuroku = false;

  if (detail && alb) { prefix = `${detail}『${alb}』`; needShuroku = true; }
  else if (alb)     { prefix = `『${alb}』`;            needShuroku = true; }
  else if (detail)  { prefix = `${detail}`;            needShuroku = true; }

  if (needShuroku){
    if (prefix) infoAlbEl.appendChild(document.createTextNode(prefix));

    const sp = document.createElement('span');
    sp.className = 'noSplit';
    sp.textContent = '収録';
    infoAlbEl.appendChild(sp);
  }
  /* ✅ ここまで */

  const links = (song.links||[]);
  const liveLinks  = [];
  const otherLinks = [];
  links.forEach(l=>{
    const label = (typeof l === 'string') ? 'Link' : (l?.label || 'Link');
    if (isLiveLink(label)) liveLinks.push(l);
    else otherLinks.push(l);
  });

  const liveWrap  = document.getElementById('liveWrap');
  const otherWrap = document.getElementById('otherWrap');

  document.getElementById('infoLiveLinks').innerHTML = makeLinksHTML(liveLinks);
  liveWrap.style.display = liveLinks.length ? 'block' : 'none';

  document.getElementById('infoOtherLinks').innerHTML = makeLinksHTML(otherLinks);
  otherWrap.style.display = otherLinks.length ? 'block' : 'none';

  return { fadeoutDoneAt };
}

/* ✅ 画面3のタイトル/情報を「show」で順番に出す */
function revealScreen3(){
  const titleEl = document.getElementById('songTitleFixed');
  const block   = document.getElementById('infoBlock');

  titleEl.classList.remove('show');
  block.classList.remove('show');
  block.querySelectorAll('.infoStep').forEach(el => el.classList.remove('show'));

  later(CONFIG.TITLE_AFTER_FADEOUT_MS, ()=>{
    titleEl.classList.add('show');
  });

  later(CONFIG.TITLE_AFTER_FADEOUT_MS + CONFIG.INFO_AFTER_TITLE_MS, ()=>{
    block.classList.add('show');

    const steps = Array.from(block.querySelectorAll('.infoStep'))
      .filter(el => getComputedStyle(el).display !== 'none');

    steps.forEach((el, i)=>{
      later(i * CONFIG.STEP_MS, ()=> el.classList.add('show'));
    });
  });
}

async function startFlow(){
  if(!songs.length){ alert(`${CONFIG.DATA_FILE} が読み込めませんでした`); return; }
  clearTimers();

  // ✅ 画面1で見えている背景に合わせて曲を抽選（yougなら<22、その他なら>=22）
  current = pickSongByStartMode(songs);

  showScreen('screen2');

  resetUI();
  const { fadeoutDoneAt } = renderAll(current);

  later(fadeoutDoneAt, ()=>{
    showScreen('screen3');
    revealScreen3();
  });
}

(async function init(){
  // ✅ ページを開いた瞬間に「画面1の背景」と「抽選モード」を確定
  decideStartBackgroundAndMode();

  await loadSongs();
  document.getElementById('startBtn').addEventListener('click', startFlow);
})();
</script>
