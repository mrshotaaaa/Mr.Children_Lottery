<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YourSong – Mobile 9:16 + MS Gothic + Sync FadeOut</title>

<!-- =========================
  (1) 設定だけここを触ればOK
========================= -->
<style>
  :root{
    /* ===== フェード時間（CSS変数：JSが起動時に上書き） ===== */
    --screen-fade-ms: 2000ms;   /* 画面切替（screen1⇄screen2） */
    --text-fade-ms:   3500ms;   /* 文字（タイトル／歌詞行／情報）のフェード */

    /* フォント */
    --font-lyrics: 20px;                         /* 歌詞の基準サイズ */
    --font-title: clamp(26px, 5vw, 56px);        /* タイトル（可変） */
    --font-info: 16px;                           /* 情報テキスト */

    /* 配色 */
    --c-bg: #ffffff;     /* 画面背景（歌詞用） */
    --c-text: #111111;   /* 文字：黒 */
    --accent: #0b6bff;

    /* 歌詞位置（ステージ内） */
    --lyrics-h: center;  --lyrics-v: center;     /* start|center|end */
    --lyrics-x: 0px;     --lyrics-y: 0px;

    /* タイトル（左上） */
    --title-left: 16px;  --title-top: 16px;
  }

  /* =========================
     (固定) ビューポート全体
     ========================= */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center;
    background:#000; /* ステージ外は黒（レターボックス） */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  }

  /* =========================
     ステージ（常に 9:16）
     ========================= */
  .stage{
    position:relative;
    aspect-ratio: 9 / 16; /* ★ スマホ比 */
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    overflow:hidden; border-radius: 12px; background:#000;
    -webkit-tap-highlight-color: transparent;
  }

  /* 画面セクション（切替） */
  .screen{
    position:absolute; inset:0; display:grid;
    justify-items:stretch; align-items:stretch;
    opacity:0; pointer-events:none; transition: opacity var(--screen-fade-ms) ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* 画面1（スタート） */
  #screen1{
    background: radial-gradient(60% 50% at 20% 15%, rgba(15,23,42,.85) 0, rgba(11,15,20,.9) 65%), #0b0f14;
    color:#e6edf3; text-align:center;
  }
  .stack{
    display:grid; gap:14px; padding:16px; width:92%; max-width: 520px;
    justify-self:center; align-self:center; transform:translateY(-40px);
  }
  .startTitle{ font-size: clamp(22px, 5.4vw, 38px); letter-spacing:.08em; font-weight:700; }
  .btn{
    justify-self:center; appearance:none; cursor:pointer;
    padding:12px 18px; border-radius:14px;
    border:1px solid #1f2937; background:#111823; color:#e6edf3; font-size:16px;
  }
  .btn:focus{ outline:2px solid #60a5fa; outline-offset:3px }

  /* 画面2（白背景・黒文字） */
  #screen2{ background: var(--c-bg); color: var(--c-text); }

  /* 歌詞（中央） */
  .lyricsWrap{
    justify-self: var(--lyrics-h);
    align-self: var(--lyrics-v);
    transform: translate(var(--lyrics-x), var(--lyrics-y));
    width: 92%; max-width: 560px; padding: 4vh 2vw; text-align: center;
  }
  .lyrics{
    white-space: pre-wrap; line-height: 1.9; font-size: var(--font-lyrics);
    font-family: "MS Gothic","MS PGothic","ＭＳ ゴシック","ＭＳ Ｐゴシック",
                 "Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  }

  /* 行単位のアニメ（最初は非表示） */
  .lyrics .line{
    opacity:0; transform: translateY(10px);
    transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
    will-change: opacity, transform;
  }
  .lyrics .line.show{ opacity:1; transform:none; }

  /* タイトル（左上・テキスト用フェード） */
  .titleFixed{
    position: absolute; left: var(--title-left); top: var(--title-top);
    margin:0; font-size: var(--font-title); font-weight: 800; letter-spacing: .02em;
    opacity:0; transform: translateY(-6px);
    transition: opacity var(--text-fade-ms) ease, transform var(--text-fade-ms) ease;
  }
  .titleFixed.show{ opacity:1; transform:none; }

  /* 情報（中央・テキスト用フェード） */
  .infoBlock{
    position:absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92%, 560px);
    display:grid; grid-template-columns: 1fr; gap: 10px;
    opacity:0; transition: opacity var(--text-fade-ms) ease;
    text-align:center; color: var(--c-text);
  }
  .infoBlock.show{ opacity:1; }
  .infoImage{
    width:100%; height:auto; object-fit:contain; display:none; border-radius: 6px;
  }
  .infoText{ font-size: var(--font-info); margin:0; }
  .linkList a{ color: var(--accent); text-decoration: underline; }
  .linkList{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

  /* モバイル微調整 */
  @media (max-width: 420px) {
    :root{
      --font-lyrics: 18px; --font-info: 15px;
      --title-left: 12px; --title-top: 12px;
    }
    .stack{ transform: translateY(-28px); }
  }

  /* 横持ち対策 */
  @media (max-aspect-ratio: 9/16) {
    .stage{ width: 100vw; height: calc(100vw * 16 / 9); }
  }
</style>
</head>

<body>
  <!-- スマホ比 9:16 のステージ -->
  <div class="stage" role="application" aria-label="YourSong 9:16 Stage">
    <!-- 画面1：スタート -->
    <section id="screen1" class="screen active" aria-label="Start">
      <div class="stack">
        <div class="startTitle">GIFT for you</div>
        <button id="startBtn" class="btn">YourSong</button>
      </div>
    </section>

    <!-- 画面2：白背景・黒文字 -->
    <section id="screen2" class="screen" aria-live="polite" aria-atomic="true">
      <!-- 歌詞（中央） -->
      <div class="lyricsWrap">
        <div id="lyrics" class="lyrics"></div>
      </div>

      <!-- 左上：タイトル -->
      <h1 id="songTitleFixed" class="titleFixed"></h1>

      <!-- 中央：image / album / albumdetail / release / links -->
      <div id="infoBlock" class="infoBlock">
        <img id="infoImage" class="infoImage" alt="">
        <p id="infoAlbum" class="infoText"></p>
        <p id="infoDetail" class="infoText"></p>
        <p id="infoRelease" class="infoText"></p>
        <div id="infoLinks" class="linkList"></div>
      </div>
    </section>
  </div>

<!-- =========================
  (2) 動作設定：ここだけ触れば挙動を変えられる
========================= -->
<script>
  const CONFIG = {
    DATA_FILE: 'songsinfo.json',    // JSON（同フォルダ）
    IMAGE_BASE: 'images/',          // JSONの "image": "重力と呼吸.png" のベースパス

    /* ===== フェード時間 ===== */
    SCREEN_FADE_MS: 2000,           // 画面切替（screen1⇄screen2）
    TEXT_FADE_MS:   3500,           // 文字（タイトル／歌詞行／情報）

    /* ===== 歌詞のタイミング ===== */
    LYRICS_DELAY_MS:   2500,        // 画面2になってから「1行目」を出すまでの遅延
    LINE_STAGGER_MS:   4000,        // 行ごとの表示開始“ずらし”
    HOLD_AFTER_LAST_MS: 4000,       // ★ 最終行の表示開始から、全行フェードアウト開始まで 何ms 待つか

    /* ===== タイトル／情報（歌詞フェードアウト完了からの相対） =====
       注: 歌詞フェードアウト「完了」は、フェードアウト開始 + TEXT_FADE_MS
    */
    TITLE_AFTER_FADEOUT_MS:  2000,   // 歌詞フェードアウト完了 → タイトル表示 まで
    INFO_AFTER_TITLE_MS:     3000    // タイトル表示 → 情報表示 まで
  };

  /* 内部状態 */
  let songs = [], current = null, timers = [];

  /* 便利：URL組み立て（日本語・空白OK） */
  function buildUrl(base, filename){
    if (!filename) return '';
    if (/^https?:\/\//i.test(filename)) return filename;
    const joined = base.replace(/\/?$/, '/') + filename;
    return encodeURI(joined);
  }

  /* JSONロード */
  async function loadSongs(){
    try{
      const url = new URL(CONFIG.DATA_FILE, location.href).toString();
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status} (${res.statusText})`);
      const text = await res.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data) || !data.length) throw new Error('JSON is empty or not an array');
      songs = data.map(normalizeSong);
    }catch(e){
      console.error('[loadSongs] failed:', e);
      alert(`${CONFIG.DATA_FILE} が読み込めませんでした\n→ ${e.message}`);
      songs = [];
    }
  }

  /* JSON → 内部形式 */
  function normalizeSong(raw){
    const links=[]; const L=raw.link;
    if(L){
      if(typeof L==='string') links.push({label:'Link',url:L});
      else if(Array.isArray(L)) L.forEach(x=> typeof x==='string'
        ? links.push({label:'Link',url:x})
        : (x?.url && links.push({label:x.label||'Link',url:x.url})));
      else if(L?.url) links.push({label:L.label||'Link',url:L.url});
    }
    return {
      id: raw.id,
      title: raw.Title || '',
      album: raw.album || '',
      albumdetail: raw.albumdetail || '',
      release: raw.release ?? '',
      image: raw.image || '',
      lyrics: Array.isArray(raw.Lyrics) ? raw.Lyrics.join('\n') : String(raw.Lyrics || ''),
      links
    };
  }

  /* 画面切替（CSS変数に反映） */
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* タイマー管理 */
  function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
  const later = (ms, fn) => { const t=setTimeout(fn, ms); timers.push(t); };

  /* 歌詞HTMLを行要素に分解して生成（行単位フェードイン／全行同時フェードアウト） */
  function setLyricLines(container, text){
    container.innerHTML = ''; // クリア
    const lines = String(text || '').split(/\r?\n/);
    const lineEls = [];

    lines.forEach((lineText, i)=>{
      const el = document.createElement('div');
      el.className = 'line';
      el.textContent = lineText.length ? lineText : ' ';
      container.appendChild(el);
      lineEls.push(el);

      // 行ごとのフェードイン開始（ずらし）
      later(CONFIG.LYRICS_DELAY_MS + i * CONFIG.LINE_STAGGER_MS, ()=>{
        el.classList.add('show');
      });
    });

    // ★ 全行フェードアウト：最終行の表示開始から HOLD_AFTER_LAST_MS 後に一斉に開始
    const lastStart = CONFIG.LYRICS_DELAY_MS + Math.max(0, (lines.length - 1)) * CONFIG.LINE_STAGGER_MS;
    const fadeOutStartAt = lastStart + CONFIG.HOLD_AFTER_LAST_MS;

    later(fadeOutStartAt, ()=>{
      lineEls.forEach(el => el.classList.remove('show')); // 一斉にフェードアウト開始（所要 TEXT_FADE_MS）
    });

    // 「歌詞フェードアウト完了」時刻（＝開始 + TEXT_FADE_MS）を返す
    return fadeOutStartAt + CONFIG.TEXT_FADE_MS;
  }

  /* 描画初期化 */
  function resetUI(){
    document.getElementById('lyrics').innerHTML = '';
    const title = document.getElementById('songTitleFixed');
    title.textContent = ''; title.classList.remove('show');

    const img = document.getElementById('infoImage');
    img.removeAttribute('src'); img.style.display='none';
    document.getElementById('infoAlbum').textContent = '';
    document.getElementById('infoDetail').textContent = '';
    document.getElementById('infoRelease').textContent = '';
    document.getElementById('infoLinks').innerHTML = '';
    document.getElementById('infoBlock').classList.remove('show');
  }

  function renderAll(song){
    // 歌詞（行に分解）
    const fadeoutDoneAt = setLyricLines(
      document.getElementById('lyrics'),
      (song.lyrics||'').trim()
    );

    // タイトル文字
    document.getElementById('songTitleFixed').textContent = song.title || '—';

    // 情報（中央）
    const img = document.getElementById('infoImage');
    if (song.image) {
      const src = buildUrl(CONFIG.IMAGE_BASE, song.image);
      img.src = src;
      img.alt = song.title ? `${song.title} image` : 'song image';
      img.style.display = 'block';
      img.onerror = () => { img.style.display = 'none'; };
    } else {
      img.style.display = 'none';
    }
    document.getElementById('infoAlbum').textContent  = song.album || '';
    document.getElementById('infoDetail').textContent = song.albumdetail || '';
    document.getElementById('infoRelease').textContent= String(song.release ?? '');

    // Links
    const links=(song.links||[]);
    const html = Array.isArray(links)
      ? links.map(l=> (typeof l==='string')
          ? `<a href="${l}" target="_blank" rel="noopener">Link</a>`
          : (l?.url ? `<a href="${l.url}" target="_blank" rel="noopener">${l.label||'Link'}</a>` : '')
        ).filter(Boolean).join('')
      : (links?.url ? `<a href="${links.url}" target="_blank" rel="noopener">${links.label||'Link'}</a>` : '');
    document.getElementById('infoLinks').innerHTML = html;

    return { fadeoutDoneAt };
  }

  /* フロー：Start → Screen2 → 歌詞（行ずらし→全行同時フェードアウト）→ タイトル → 情報 */
  async function startFlow(){
    if(!songs.length){ alert(`${CONFIG.DATA_FILE} が読み込めませんでした`); return; }
    clearTimers();

    /* CSS変数に反映（画面/文字フェード） */
    document.documentElement.style.setProperty('--screen-fade-ms', `${CONFIG.SCREEN_FADE_MS}ms`);
    document.documentElement.style.setProperty('--text-fade-ms',   `${CONFIG.TEXT_FADE_MS}ms`);

    current = songs[Math.floor(Math.random()*songs.length)];

    // 画面遷移（screen1 → screen2）
    showScreen('screen2');

    // 内容準備
    resetUI();
    const { fadeoutDoneAt } = renderAll(current);

    // ★ タイトル／情報は「歌詞フェードアウト完了」からの相対
    later(fadeoutDoneAt + CONFIG.TITLE_AFTER_FADEOUT_MS, ()=>{
      document.getElementById('songTitleFixed').classList.add('show');
    });
    later(fadeoutDoneAt + CONFIG.TITLE_AFTER_FADEOUT_MS + CONFIG.INFO_AFTER_TITLE_MS, ()=>{
      document.getElementById('infoBlock').classList.add('show');
    });
  }

  /* 起動 */
  (async function init(){
    try{ await loadSongs(); }catch(e){ console.warn(e); }
    document.getElementById('startBtn').addEventListener('click', startFlow);
    window.addEventListener('keydown', e=>{
      if(e.key==='Enter'||e.key===' '){
        const s1 = document.getElementById('screen1');
        if(s1.classList.contains('active')){
          e.preventDefault(); startFlow();
        }
      }
    });
  })();
</script>
</body>
</html>
